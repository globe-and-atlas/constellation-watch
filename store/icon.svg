<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="144" height="144" rx="28" fill="#061b2b"/>
  
  <!-- Outer Celestial Reference Grid -->
  <circle cx="72" cy="72" r="62" fill="none" stroke="#132c3f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <circle cx="72" cy="72" r="50" fill="none" stroke="#16384f" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- GLONASS Orbit Ring (high inclination ~65deg) -->
  <g transform="rotate(70 72 72)">
    <ellipse cx="72" cy="72" rx="54" ry="17" fill="none" stroke="#256d56" stroke-width="2"/>
    <ellipse cx="72" cy="72" rx="54" ry="17" fill="none" stroke="#55ffaa" stroke-width="2" stroke-dasharray="8 36"/>
  </g>

  <!-- GPS Orbit Ring (inclination 55deg, rotated -28deg) -->
  <g transform="rotate(-28 72 72)">
    <ellipse cx="72" cy="72" rx="55" ry="19" fill="none" stroke="#ffaa00" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Galileo Orbit Ring (inclination 56deg, rotated +32deg) -->
  <g transform="rotate(32 72 72)">
    <ellipse cx="72" cy="72" rx="55" ry="19" fill="none" stroke="#00ffff" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Earth Central Sphere -->
  <circle cx="72" cy="72" r="26" fill="#0b3935" stroke="#4d7778" stroke-width="2.5"/>
  <!-- Earth Grid Lines -->
  <line x1="46" y1="72" x2="98" y2="72" stroke="#1a5d57" stroke-width="1.5"/>
  <ellipse cx="72" cy="72" rx="14" ry="26" fill="none" stroke="#1a5d57" stroke-width="1.5"/>
  <line x1="72" y1="46" x2="72" y2="98" stroke="#1a5d57" stroke-width="1.5"/>
  
  <!-- Stylized Landmasses -->
  <path d="M64 56 Q70 52 76 56 Q82 60 80 66 Q74 68 68 64 Z" fill="#1b6e5f"/>
  <path d="M68 76 Q78 74 76 84 Q70 88 66 82 Z" fill="#1b6e5f"/>

  <!-- Satellite Nodes (active orbital vehicles) -->
  <!-- GPS Sat (Amber) -->
  <g transform="translate(116, 48)">
    <circle cx="0" cy="0" r="6" fill="#ffaa00" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#ffaa00"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Galileo Sat (Cyan) -->
  <g transform="translate(30, 46)">
    <circle cx="0" cy="0" r="6" fill="#00ffff" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#00ffff"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- GLONASS Sat (Mint) -->
  <g transform="translate(76, 18)">
    <circle cx="0" cy="0" r="5" fill="#55ffaa" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="3.5" fill="#55ffaa"/>
    <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
  </g>

  <!-- BeiDou Sat (Rose / Magenta) -->
  <g transform="translate(104, 98)">
    <circle cx="0" cy="0" r="5" fill="#ff55aa" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="3.5" fill="#ff55aa"/>
    <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Observer Ground Station Zenith Pulse -->
  <circle cx="72" cy="62" r="3.5" fill="#ffffff"/>
  <circle cx="72" cy="62" r="7" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
</svg>
